[workspace]
resolver = "3"
members = ["crates/carracho-probe", "crates/carracho-proto", "crates/carracho-server", "crates/carracho-tracker"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.0.0"
rust-version = "1.85"

[workspace.dependencies]
carracho-proto = { path = "crates/carracho-proto", version = "0.0" }
anyhow = "1"
blowfish = { version = "0.10", features = ["bcrypt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
md-5 = "0.11"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
